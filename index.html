<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小銅板</title>
<meta name="description" content="每天告訴你今天還能花多少的記帳 App">
<meta name="theme-color" content="#FAF6FE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14101B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小銅板">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ===== 色彩（照 DESIGN.md；深色只換色值）===== */
:root{
  --page:#F3EEF9; --bg:#FAF6FE; --surface:#FFFFFF; --surface-2:#F2EBFA; --text:#17121F; --muted:#5D566B; --line:#ECE4F5; --track:#E9E0F4;
  --primary:#7C3AED; --primary-press:#6D28D9; --on-primary:#FFFFFF; --primary-soft:#EDE4FD; --primary-ink:#5B21B6;
  --ok:#047857; --ok-soft:#D7F5E7; --warn:#B45309; --warn-soft:#FDF0D2; --bad:#C2261D; --bad-soft:#FDE3E1;
  --amber:#B45309; --amber-soft:#FDF0D2; --amber-ink:#7A4210;
  --toast-bg:#211A2C; --toast-fg:#F4EFFA; --toast-link:#C4B5FD; --scrim:rgba(23,18,31,.38);
  --sheet-shadow:0 -8px 30px rgba(40,10,80,.16);
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  /* 分類色：12 種讓使用者挑（色相避開紫色和綠／琥珀／紅）；salary 只給收入用，rest 是圓環上「沒放首頁的分類」 */
  --c-blue:#2563EB; --c-cyan:#0E7490; --c-teal:#2C7A78; --c-denim:#3F6E8C; --c-navy:#1E3A8A; --c-slate:#475569;
  --c-pink:#BE185D; --c-magenta:#A21CAF; --c-brown:#8B5E3C; --c-cocoa:#6B4F3A; --c-olive:#65701F; --c-stone:#78716C;
  --c-salary:#334155; --c-rest:#C9C0D4; --on-cat:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0E0B13; --bg:#14101B; --surface:#1E1828; --surface-2:#282133; --text:#F3EEFA; --muted:#A9A1B7; --line:#2F283B; --track:#342C40;
  --primary:#A78BFA; --primary-press:#B9A2FB; --on-primary:#1B1030; --primary-soft:#2E2347; --primary-ink:#C4B5FD;
  --ok:#34D399; --ok-soft:#0F3A2E; --warn:#FBBF24; --warn-soft:#3B2A0A; --bad:#F87171; --bad-soft:#3F1A1A;
  --amber:#FBBF24; --amber-soft:#3B2A0A; --amber-ink:#EBCB8B;
  --toast-bg:#F3EEFA; --toast-fg:#15111C; --toast-link:#6D28D9; --scrim:rgba(0,0,0,.55); --sheet-shadow:0 -8px 30px rgba(0,0,0,.45);
  --c-blue:#3B72D9; --c-cyan:#1A86A3; --c-teal:#378A87; --c-denim:#5A8BAA; --c-navy:#4A69C4; --c-slate:#66758C;
  --c-pink:#C43F78; --c-magenta:#A646B8; --c-brown:#A06C42; --c-cocoa:#8E6E55; --c-olive:#7F8A33; --c-stone:#857E78;
  --c-salary:#66758C; --c-rest:#4A4157; --on-cat:#14101B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0E0B13; --bg:#14101B; --surface:#1E1828; --surface-2:#282133; --text:#F3EEFA; --muted:#A9A1B7; --line:#2F283B; --track:#342C40;
  --primary:#A78BFA; --primary-press:#B9A2FB; --on-primary:#1B1030; --primary-soft:#2E2347; --primary-ink:#C4B5FD;
  --ok:#34D399; --ok-soft:#0F3A2E; --warn:#FBBF24; --warn-soft:#3B2A0A; --bad:#F87171; --bad-soft:#3F1A1A;
  --amber:#FBBF24; --amber-soft:#3B2A0A; --amber-ink:#EBCB8B;
  --toast-bg:#F3EEFA; --toast-fg:#15111C; --toast-link:#6D28D9; --scrim:rgba(0,0,0,.55); --sheet-shadow:0 -8px 30px rgba(0,0,0,.45);
  --c-blue:#3B72D9; --c-cyan:#1A86A3; --c-teal:#378A87; --c-denim:#5A8BAA; --c-navy:#4A69C4; --c-slate:#66758C;
  --c-pink:#C43F78; --c-magenta:#A646B8; --c-brown:#A06C42; --c-cocoa:#8E6E55; --c-olive:#7F8A33; --c-stone:#857E78;
  --c-salary:#66758C; --c-rest:#4A4157; --on-cat:#14101B;
  color-scheme:dark}

/* ===== 基本 ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input{caret-color:var(--primary)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 手機全螢幕；大螢幕置中成一支手機寬 */
.app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
.view[hidden]{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 4px}
.topbar h1,.topbar h2{margin:0;font-size:22px;letter-spacing:.01em}
.date{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-2);display:grid;place-content:center;color:var(--text);flex:none}
.iconbtn:active{background:var(--primary-soft)}
.linkbtn{border:0;background:none;padding:8px 2px;color:var(--primary-ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* ===== 今天 ===== */
.hero{padding:6px 18px 12px;display:grid;gap:2px}
.lbl{font-size:13px;color:var(--muted)}
.bigrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.12;color:var(--st);font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:600;margin-right:3px;letter-spacing:0}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--st-soft);color:var(--st);white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--st);transition:width .4s var(--ease)}
.recover{font-size:13px;color:var(--bad);margin-top:6px}
.st-ok{--st:var(--ok);--st-soft:var(--ok-soft)}
.st-tight{--st:var(--warn);--st-soft:var(--warn-soft)}
.st-over{--st:var(--bad);--st-soft:var(--bad-soft)}
.st-none{--st:var(--muted);--st-soft:var(--surface-2)}

.slot{margin:0 14px 12px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;width:calc(100% - 28px);color:var(--text)}
.slot .badge{width:36px;height:36px;border-radius:12px;display:grid;place-content:center;flex:none;background:var(--surface-2)}
.slot .badge .dot{width:36px;height:36px;border-radius:12px;display:grid;place-content:center;color:var(--on-cat)}
.slot .badge .dot .ico{width:18px;height:18px}
.slot .t{flex:1;min-width:0;display:grid;gap:1px}
.slot .t b{font-size:14px;font-weight:600}
.slot .t span{font-size:12.5px;color:var(--muted)}

.slot .acts2{display:flex;gap:6px;margin-top:8px}
.slot .acts2 .btn{min-height:38px;padding:0 14px;font-size:14px}
.slot.tall{align-items:flex-start}
.ringwrap .center{cursor:pointer;border-radius:50%}
.ringwrap .center:active .ring{transform:rotate(-90deg) scale(.97)}
.hintrow{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:0 18px 4px}
.hintrow .linkbtn{font-size:12.5px}
.ringwrap{padding:2px 12px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:center;justify-items:center}
.ringwrap .center{grid-column:2;grid-row:2;position:relative;width:136px;height:136px}
.ring{width:136px;height:136px;transform:rotate(-90deg)}
.ring circle{transition:stroke-dasharray .55s var(--ease),stroke-dashoffset .55s var(--ease),opacity .25s}
.ring.dim circle[data-c]{opacity:.28}
.ring.dim circle[data-c].sel{opacity:1}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.3}
.ringtxt span{font-size:11px;color:var(--muted)}
.ringtxt b{font-size:19px;font-variant-numeric:tabular-nums}
.rcat{display:grid;justify-items:center;gap:2px;width:88px;min-height:68px;border:0;background:none;font-size:12.5px;padding:4px 0;border-radius:14px;color:var(--text)}
.rcat:active{background:var(--surface-2)}
.rcat .dot{width:42px;height:42px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat);transition:transform .2s var(--ease)}
.rcat:active .dot{transform:scale(.92)}
.rcat .amtsm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.todaybox{margin:0 18px 18px;display:grid;border-top:1px solid var(--line)}
.today-toggle{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:2px 0;font-size:13px;color:var(--muted);min-height:44px}

.rcat.empty{color:var(--muted)}
.rcat.empty .dot{background:none;border:1.5px dashed var(--muted);color:var(--muted)}
.textbtn{border:0;background:none;color:var(--primary-ink);font-weight:600;font-size:15px;min-height:44px;padding:0 8px}

/* ===== 分類：全部分類、編輯首頁、新增／修改 ===== */
.count{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.count.maxed{color:var(--primary-ink)}
.sheet-head h3 .count{margin-left:6px}
.secttl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:-6px}
.secttl .linkbtn{font-size:12.5px;min-height:36px;padding:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px}
.tile{display:grid;justify-items:center;align-content:start;gap:3px;border:0;background:none;padding:6px 0 4px;border-radius:14px;font-size:12.5px;color:var(--text);min-height:76px;position:relative}
.tile:active{background:var(--surface-2)}
.tile .dot{width:40px;height:40px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.tile .dot .ico{width:19px;height:19px}
.tile .amtsm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.add{color:var(--muted)}
.tile.add .dot{background:none;border:1.5px dashed var(--muted);color:var(--muted)}
.tile:disabled{opacity:.45;cursor:default}
.tile .pen{position:absolute;top:2px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-content:center;color:var(--text)}
.tile .pen .ico{width:11px;height:11px;stroke-width:2.4}
.tile[aria-pressed="true"]{font-weight:600}
.tile[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.full .tile[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.center-note{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.eboard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 4px}
.eboard .ringwrap{padding:0}
.ecenter{grid-column:2;grid-row:2;display:grid;place-content:center;text-align:center;width:120px;height:120px;border-radius:50%;border:12px solid var(--track)}
.ecenter b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.ecenter span{font-size:11px;color:var(--muted)}
.eslot{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.eslot.filled{cursor:grab}
.eslot .x{position:absolute;top:0;right:10px;width:24px;height:24px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-content:center;padding:0}
.eslot .x .ico{width:12px;height:12px;stroke-width:2.6}
.eslot.sel{color:var(--primary-ink);font-weight:600}
.eslot.empty.sel .dot{border-style:solid;border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.eslot.filled.sel .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--primary)}
.eslot.over .dot{box-shadow:0 0 0 3px var(--primary)}
.eslot.dragging{opacity:.35}
.dragghost{position:absolute;z-index:40;pointer-events:none;width:88px;display:grid;justify-items:center;gap:2px;font-size:12.5px;color:var(--text);transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 8px 14px rgba(40,10,80,.25))}
.dragghost .dot{width:42px;height:42px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 13px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--text)}
.pchip .dot{width:28px;height:28px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.pchip .dot .ico{width:15px;height:15px}
.pchip > .ico{width:14px;height:14px;color:var(--muted)}
.pchip:disabled{opacity:.45;cursor:default}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.cpreview{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.cpreview .dot{width:48px;height:48px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.cpreview .dot .ico{width:22px;height:22px}
.cpreview b{font-size:17px}
.cpreview span span{display:block;font-size:12.5px;color:var(--muted)}
.flabel{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.tinput{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--text);width:100%}
.tinput::placeholder{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swc{aspect-ratio:1;border-radius:50%;border:0;display:grid;place-content:center;color:var(--on-cat)}
.swc .ico{width:16px;height:16px;stroke-width:2.6;opacity:0}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.swc[aria-pressed="true"] .ico{opacity:1}
.swc{position:relative}
.swc .used{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--bg)}
.swc .used::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--muted)}
.swnote{margin:-2px 0 0;font-size:12.5px;color:var(--muted)}
.picked{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface-2)}
.picked .dot{width:32px;height:32px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.picked .dot .ico{width:16px;height:16px}
.picked b{flex:1;font-size:15px}
.cfdanger{display:grid;gap:4px;padding-top:18px;margin-top:8px;border-top:1px solid var(--line)}
.selbar{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-radius:14px;background:var(--primary-soft);color:var(--primary-ink);font-size:13.5px}
.selbar span{flex:1}
.selbar .btn{min-height:38px;padding:0 14px;font-size:14px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ib{aspect-ratio:1;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-content:center;color:var(--text)}
.ib[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink);box-shadow:inset 0 0 0 2px var(--primary)}
.kopt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;color:var(--text);width:100%}
.kopt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.kopt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.kopt[aria-pressed="true"] .rd{border:5px solid var(--primary)}
.kopt b{font-size:14.5px;display:block;font-weight:600}
.kopt span span{font-size:12.5px;color:var(--muted)}
.tgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:6px 0;text-align:left;width:100%;color:var(--text);font-size:15px;min-height:56px}
.tgrow span span{display:block;font-size:12.5px;color:var(--muted)}
.tg{width:46px;height:28px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.tgrow[aria-pressed="true"] .tg{background:var(--primary)}
.tgrow[aria-pressed="true"] .tg::after{transform:translateX(18px)}
.tgrow:disabled{opacity:.5;cursor:default}
.stickybar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 0 6px;display:grid;gap:4px}
.btn.quiet{background:none;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* ===== 記帳面板 ===== */
.entry-sheet{display:grid;gap:10px}
.cathead{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.cathead .dot{width:30px;height:30px;border-radius:50%;display:grid;place-content:center;color:var(--on-cat)}
.cathead .dot .ico{width:16px;height:16px}
.amt{display:flex;align-items:center;gap:8px}
.amt .note{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:16px}
.amt .note::placeholder{color:var(--muted)}
.amt .val{font-size:24px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt .val.zero{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:4px;flex:none;min-height:36px;padding:0 13px;border-radius:999px;border:0;background:var(--surface-2);color:var(--text);font-size:13px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:600}
.chip.item{background:none;border:1px solid var(--line);font-size:13px}
.chip.item[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{min-height:46px;border:0;border-radius:12px;background:var(--surface-2);font-size:19px;font-variant-numeric:tabular-nums;display:grid;place-content:center}
.keys button:active{background:var(--primary-soft)}
.save{min-height:50px;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:600}
.save:active{background:var(--primary-press)}
.save:disabled{background:var(--surface-2);color:var(--muted);cursor:default}

/* ===== 清單 ===== */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:var(--text);min-height:52px}
.row:last-child{border-bottom:0}
.row .cic{width:32px;height:32px;border-radius:10px;display:grid;place-content:center;flex:none;color:var(--on-cat)}
.row .cic .ico{width:17px;height:17px}
.row .n{flex:1;min-width:0;display:grid;line-height:1.35}
.row .n b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.row .a.in{font-weight:600}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pad{padding:0 18px 24px;display:grid;gap:6px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav b{min-width:84px;text-align:center;font-size:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:16px;color:var(--text);min-height:42px}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}
.summary{display:flex;gap:16px;font-size:13px;color:var(--muted);padding:2px 0 4px}
.summary b{color:var(--text);font-variant-numeric:tabular-nums}
.day{display:grid}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:10px 0 2px;border-bottom:1px solid var(--line)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

/* ===== 分頁列 ===== */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 0 max(10px,env(safe-area-inset-bottom,0px))}
.tabs button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);border:0;background:none;min-height:48px}
.tabs button[aria-current="page"]{color:var(--primary-ink);font-weight:600}
.tabs button[aria-current="page"] .ico{color:var(--primary)}

/* ===== 疊層 ===== */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:23}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(105%);transition:transform .32s var(--ease);z-index:24;box-shadow:var(--sheet-shadow)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--track);justify-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-size:17px}
.full{position:absolute;inset:0;background:var(--bg);z-index:22;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s var(--ease)}
.full.on{transform:none}
.full.noanim{transition:none}
.full .view{padding-top:0}
.backbar{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 6px}
.backbar h2{margin:0;font-size:18px;flex:1}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:500}
.btn.danger{background:var(--surface-2);color:var(--bad);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--text);width:100%}
.field input::placeholder{color:var(--muted)}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:0 16px;min-height:38px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.h3{margin:18px 0 2px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.panel{display:grid;border-top:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);font-size:15px;width:100%;background:none;text-align:left;color:var(--text);min-height:52px}
.setrow span{color:var(--muted);font-size:13px}
.setrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note-p{margin:0;font-size:13px;color:var(--muted)}
.doc{display:grid;gap:18px;padding:4px 18px 28px}
.doc section{display:grid;gap:6px}
.doc h3{margin:0;font-size:16px}
.doc p{margin:0;font-size:14px}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--primary)}
.big-q{font-size:19px;font-weight:600;line-height:1.4;margin:0}
.stepbody{display:grid;gap:12px;animation:stepin .34s var(--ease)}
@keyframes stepin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.toast{visibility:hidden;position:absolute;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:10px 12px 10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.show{visibility:visible;opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:none;color:var(--toast-link);font-weight:600;min-height:40px;padding:0 6px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="view" id="v-today" aria-label="今天"></main>
  <main class="view" id="v-list" aria-label="明細" hidden></main>
  <nav class="tabs" aria-label="分頁">
    <button type="button" data-tab="today" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>今天</button>
    <button type="button" data-tab="list"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>明細</button>
  </nav>
  <div class="scrim" id="scrim"></div>

</div>

<script>
'use strict';
/* =========================================================

const ico = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON[k] || ICON.other}</svg>`;

/* ===== 分類 =====
   支出分類存在使用者資料（D.cats），可以新增、改名、換圖案和顏色、收起來。

   w = 想花才花（晚上回顧會抽問值不值得）；false = 必要的，不抽。 */

const COLORS = [['blue','藍'],['cyan','青'],['teal','藍綠'],['denim','灰藍'],['navy','深藍'],['slate','石板灰'],['pink','桃紅'],['magenta','洋紅'],['brown','棕'],['cocoa','可可'],['olive','橄欖'],['stone','暖灰']];

/* 圓環旁 8 格的位置：從 12 點鐘順時針 */

/* ===== 小工具 ===== */

/* ===== 資料 ===== */
const KEY = 'coinlet.v1';
const DEFAULT_ITEMS = [
  {n:'早餐',c:'food',watch:false},{n:'午餐',c:'food',watch:false},{n:'晚餐',c:'food',watch:false},{n:'手搖',c:'food',watch:true},

/* ===== 固定收支：時間到自動記一筆 =====
   每一期記過就留下記號（fixedDone），刪掉那筆也不會再補，等於跳過這一期。 */
function dueDates(f, fromStr, toStr){
  const from = parseYmd(fromStr), to = parseYmd(toStr), out = [];
  if (f.freq === 'year') {
    for (let y = from.getFullYear(); y <= to.getFullYear(); y++) {
      const d = new Date(y, f.month - 1, Math.min(f.day, daysIn(y, f.month - 1)));
      if (d >= from && d <= to) out.push(ymd(d));
    }
  } else {
    let y = from.getFullYear(), m = from.getMonth();
    while (y < to.getFullYear() || (y === to.getFullYear() && m <= to.getMonth())) {
      const d = new Date(y, m, Math.min(f.day, daysIn(y, m)));
      if (d >= from && d <= to) out.push(ymd(d));
      if (++m > 11) { m = 0; y++; }
    }
  }
  return out;
}
function runFixed(){
  if (!D.setupDone) return [];
  const t = todayStr(), added = [];
  D.fixed.forEach(f => {
    const from = f.since > D.startDate ? f.since : D.startDate;
    dueDates(f, from, t).forEach(ds => {
      const key = f.id + '@' + ds;
      if (D.fixedDone[key]) return;
      D.fixedDone[key] = true;
      const e = {id:uid(), date:ds, time:'09:00', type:f.type, c:f.c, n:f.n, note:'', a:f.a, fixedId:f.id, createdAt:Date.now()};
      D.entries.push(e); added.push(e);
    });
  });
  if (added.length) save();
  return added;
}
// 這個月要先扣掉的固定支出：每月的全部，加上這個月要扣款的每年項目
function monthFixedOut(y, m){
  return D.fixed.filter(f => f.type === 'out' && (f.freq !== 'year' || f.month - 1 === m)).reduce((t, f) => t + f.a, 0);
}
const monthlyFixedOut = () => D.fixed.filter(f => f.type === 'out' && f.freq !== 'year').reduce((t, f) => t + f.a, 0);

/* ===== 今天還能花 =====
   這個月可以花 = 月預算 − 這個月的固定支出（月中才開始用的話，只算剩下的天數）
   今天還能花 = （這個月可以花 − 今天以前已花）÷ 剩下的天數 − 今天已花 */
function calc(){
  if (D.budget == null) return null;
  const n = new Date(), y = n.getFullYear(), m = n.getMonth(), days = daysIn(y, m), t = ymd(n);
  const start = D.startDate ? parseYmd(D.startDate) : n;
  const firstDay = (start.getFullYear() === y && start.getMonth() === m) ? start.getDate() : 1;
  const fixedOut = monthFixedOut(y, m);
  const plan = Math.round((D.budget - fixedOut) * (days - firstDay + 1) / days);
  const outs = D.entries.filter(e => e.type === 'out' && !e.fixedId && e.date.startsWith(monthKey(y, m)));
  const before = sum(outs.filter(e => e.date < t)), today = sum(outs.filter(e => e.date === t));
  const daysLeft = days - n.getDate() + 1;
  const daily = Math.floor((plan - before) / daysLeft);
  const left = daily - today, monthLeft = plan - before - today;
  const st = left < 0 ? 'over' : (left < daily * 0.3 ? 'tight' : 'ok');
  const recover = left < 0 && daysLeft > 1 ? Math.ceil(-left / (daysLeft - 1)) : 0;
  return {plan, fixedOut, prorated:firstDay > 1, before, today, daysLeft, daily, left, monthLeft, st, recover};
}
// 常用項目依最近 90 天記的次數排序
function sortedItems(){
  const since = ymd(new Date(Date.now() - 90 * 864e5)), cnt = {};
  D.entries.forEach(e => { if (e.date >= since) cnt[e.n] = (cnt[e.n] || 0) + 1; });
  return D.items.map((x, i) => ({...x, i})).sort((a, b) => (cnt[b.n] || 0) - (cnt[a.n] || 0) || a.i - b.i);
}

let drag = null;
{
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('#full .eslot.filled'); if (!el || e.target.closest('.x')) return;
    drag = {el, from:+el.dataset.eslot, x:e.clientX, y:e.clientY, moved:false, ghost:null};
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const box = $('app').getBoundingClientRect();
    if (!drag.moved) {
      drag.moved = true; drag.el.classList.add('dragging');
      const g = document.createElement('div'); g.className = 'dragghost';
      g.innerHTML = drag.el.querySelector('.dot').outerHTML + `<span>${esc(catOf(drag.el.dataset.id).n)}</span>`;
      $('app').appendChild(g); drag.ghost = g;
    }
    drag.ghost.style.left = (e.clientX - box.left) + 'px'; drag.ghost.style.top = (e.clientY - box.top) + 'px';
    document.querySelectorAll('.eslot.over').forEach(x => x.classList.remove('over'));
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.eslot');
    if (t && t !== drag.el) t.classList.add('over');
  });
  const end = e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (!d.moved) { if (e.type === 'pointerup') tapSlot(+d.el.dataset.eslot); return; }
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.eslot');
    if (t && e.type === 'pointerup') { const to = +t.dataset.eslot; [D.home[d.from], D.home[to]] = [D.home[to], D.home[d.from]]; }
    S.homeSel = null; afterCatChange();
  };
  document.addEventListener('pointerup', end);

function exportCSV(){
  const rows = [['日期','時間','收支','分類','項目','備註','金額','固定收支']];
  D.entries.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).forEach(e =>
    rows.push([e.date, e.time, e.type === 'in' ? '收入' : '支出', catOf(e.c).n, e.n, e.note, e.a, e.fixedId ? '是' : '']));
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = `小銅板-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove();

    case 'item-new': return itemSheet(null);
    case 'item-save': {
      const n = $('it-n').value.trim(); if (!n) return toast('請輸入名稱');
      const dup = D.items.findIndex(x => x.n === n); if (dup >= 0 && dup !== S.itEdit) return toast(`已經有「${n}」了`);
      const data = {n, c:$('it-c').value};
      if (S.itEdit == null) D.items.push({...data, watch:false}); else Object.assign(D.items[S.itEdit], data);
      save(); closeSheet(); settings(); return toast(`已儲存「${n}」`);
    }
    case 'item-del': { const it = D.items.splice(S.itEdit, 1)[0]; save(); closeSheet(); settings(); return toast(`已刪除「${it.n}」`); }
    case 'theme': D.theme = {system:'light', light:'dark', dark:'system'}[D.theme]; save(); applyTheme(); return settings();
    case 'help': return helpPage();
    case 'export': return exportCSV();
    case 'wipe': return openSheet(`${head('清除所有資料？')}<p class="note-p">這台裝置上的全部紀錄、固定收支和設定都會刪掉，沒辦法復原。要留存的話，先到設定匯出 CSV。</p>
      <div class="acts"><button type="button" class="btn ghost" data-act="close-sheet">取消</button><button type="button" class="btn danger" data-act="wipe-ok">全部清除</button></div>`);
    case 'wipe-ok': try { localStorage.removeItem(KEY); } catch (err) {} location.reload(); return;
    case 'ob-next': {
      obCapture();
      if (S.ob.step === 1) {
        const sal = D.fixed.find(f => f.type === 'in' && f.c === 'salary');
        if (S.ob.salary > 0) { if (sal) Object.assign(sal, {a:S.ob.salary, day:S.ob.payday}); else D.fixed.push({id:uid(), n:'薪水', a:S.ob.salary, type:'in', c:'salary', freq:'month', day:S.ob.payday, month:1, since:todayStr()}); }
        else if (sal) D.fixed = D.fixed.filter(f => f !== sal);
        save();
      }
      S.ob.step++; return onboard();
    }
    case 'ob-back': obCapture(); S.ob.step--; return onboard();
    case 'ob-skip': { S.ob = null; D.setupDone = true; D.startDate = todayStr(); save(); closeFull(); render(); return toast('之後可以在右上角的設定裡設預算'); }
    case 'ob-finish': {
      obCapture(); const fm = monthlyFixedOut();
      if (!(S.ob.budget > fm)) return toast(`月預算要比每月固定支出 NT$ ${fmt(fm)} 多，才有錢可以花`);
      const added = finishSetup(S.ob.budget), k = calc();
      return toast(added.length ? `設定好了，今天到期的「${added[0].n}」已自動記下` : `設定好了，今天可以花 NT$ ${fmt(Math.max(k.left, 0))}`);
    }
  }
});
scrim.addEventListener('click', closeSheet);
$('toast-act').addEventListener('click', () => { if (toastAct) { const f = toastAct; toastAct = null; f(); $('toast').classList.remove('show'); } });
// 備註打「午餐 120」：自動帶出金額，備註裡有常用項目的字就選起來
function onInput(e){
  if (e.isComposing) return;
  if (e.target.id === 'note' && S.entry) {
    const E = S.entry; E.note = e.target.value;
    const m = E.note.match(/^(.*?)\s*(\d{1,7})$/);
    if (m && m[1].trim()) { E.amount = m[2].replace(/^0+/, ''); const w = m[1].trim(); const it = D.items.find(i => w.includes(i.n) && i.c === E.cat); if (it) E.item = it.n; }
    renderEntry(true);
  }
  if (e.target.id === 'ob-budget' && $('ob-spend')) $('ob-spend').textContent = fmt(Math.max((Math.round(+e.target.value) || 0) - monthlyFixedOut(), 0));
  if (e.target.id === 'listq') { S.listQ = e.target.value; render({focus:'listq'}); }
  if (e.target.id === 'cf-n' && S.cf) {
    const d = S.cf.d; d.n = e.target.value; const n = d.n.trim(), dup = activeCats().some(c => c.n === n && c.id !== d.id);
    $('cf-pv').textContent = n || '分類名稱'; $('cf-dup').hidden = !dup; $('cf-save').disabled = !n || dup;
  }
}
app.addEventListener('input', onInput);
app.addEventListener('compositionend', e => onInput({target:e.target, isComposing:false}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (sheet.classList.contains('on')) closeSheet(); else if (full2.classList.contains('on')) closeCatForm(); else if (full.classList.contains('on') && !S.ob) { closeFull(); render(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.matches?.('.ringwrap .center')) { e.preventDefault(); return allCatsSheet(false); }
  // 編輯首頁：用鍵盤在分類上按 Enter 或空白鍵，跟點一下一樣（選起來／交換）
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.matches?.('.eslot.filled')) { e.preventDefault(); const i = +document.activeElement.dataset.eslot; tapSlot(i); setTimeout(() => document.querySelector(`.eslot[data-eslot="${i}"]`)?.focus(), 0); return; }
  // 記帳面板打開時可以直接用鍵盤：數字輸入金額、Backspace 刪一位、Enter 記一筆（正在打字的欄位不攔截）
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (!S.entry || typing) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); pressKey('del'); }
  else if (e.key === 'Enter') { const b = sheet.querySelector('.save'); if (b && !b.disabled) { e.preventDefault(); saveEntry(); } }
});
// 從背景回來（可能已經過了午夜或到了扣款日）：補記固定收支、重算
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const added = runFixed(); if (!S.entry) render();
  if (added.length) toast(`已自動記下「${added[0].n}」NT$ ${fmt(added[0].a)}${added.length > 1 ? ` 等 ${added.length} 筆` : ''}`);
});

/* ===== 啟動 ===== */
load(); applyTheme();
const added0 = runFixed();
render();
if (!D.setupDone) { S.ob = {step:1, salary:0, payday:5, savings:0, budget:0}; onboard(); }
else if (added0.length) toast(`已自動記下「${added0[0].n}」NT$ ${fmt(added0[0].a)}${added0.length > 1 ? ` 等 ${added0.length} 筆` : ''}`);
// 新版下載好了就提示，不用等下次打開（第一次安裝不提示）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w || !navigator.serviceWorker.controller) return;
      w.addEventListener('statechange', () => { if (w.state === 'activated') toast('有新版本了', () => location.reload(), '點一下更新', 600000); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
